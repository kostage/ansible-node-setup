---
- name: 'Create Headscale systemd service file'
  ansible.builtin.template:
    src: headscale.service.j2
    dest: /etc/systemd/system/headscale.service
    owner: root
    group: root
    mode: '0644'
  become: true
  become_user: root

- name: 'Reload systemd daemon'
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  become_user: root