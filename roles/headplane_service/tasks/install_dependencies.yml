---
- name: 'Install build dependencies'
  ansible.builtin.apt:
    update_cache: true
    name:
      - curl
      - wget
      - build-essential
      - jq
    state: present

- name: 'Check if headplane user exists'
  ansible.builtin.getent:
    database: passwd
    key: "{{ headplane_user }}"
  register: headplane_user_check
  failed_when: false

- name: 'Ensure headplane user exists with correct home directory'
  ansible.builtin.user:
    name: "{{ headplane_user }}"
    system: true
    shell: /bin/bash  # Changed from nologin to bash to allow running node scripts
    home: "/home/{{ headplane_user }}"
    create_home: true
  when: headplane_user_check is failed

- name: 'Create headplane user home directory'
  ansible.builtin.file:
    path: "/home/{{ headplane_user }}"
    state: directory
    owner: "{{ headplane_user }}"
    group: "{{ headplane_user }}"
    mode: '0755'

- name: 'Install nvm (Node Version Manager) for headplane service user'
  become_user: "{{ headplane_user }}"
  ansible.builtin.shell:
    cmd: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
    creates: "/home/{{ headplane_user }}/.nvm/nvm.sh"

- name: 'Install Node.js using nvm for headplane service user'
  become_user: "{{ headplane_user }}"
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      nvm install {{ nodejs_version }}
      nvm use {{ nodejs_version }}
      nvm alias default {{ nodejs_version }}
    executable: /bin/bash
  environment:
    HOME: "/home/{{ headplane_user }}"
  register: nvm_install_result_headplane

- name: 'Check if pnpm is already installed'
  become_user: "{{ headplane_user }}"
  ansible.builtin.stat:
    path: "/home/{{ headplane_user }}/.nvm/versions/node/{{ nodejs_version }}/bin/pnpm"
  register: pnpm_stat

- name: 'Install pnpm for headplane user'
  become_user: "{{ headplane_user }}"
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      npm install -g pnpm
    executable: /bin/bash
  environment:
    HOME: "/home/{{ headplane_user }}"
  when: not pnpm_stat.stat.exists

- name: 'Verify Node.js version for headplane user'
  become_user: "{{ headplane_user }}"
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      node --version
    executable: /bin/bash
  environment:
    HOME: "/home/{{ headplane_user }}"
  register: node_version_check_headplane

- name: 'Display Node.js version for headplane user'
  ansible.builtin.debug:
    msg: "Headplane user Node.js version: {{ node_version_check_headplane.stdout }}"

- name: 'Find actual Node.js binary path for headplane user'
  become_user: "{{ headplane_user }}"
  ansible.builtin.shell:
    cmd: |
      export NVM_DIR="$HOME/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
      which node
    executable: /bin/bash
  environment:
    HOME: "/home/{{ headplane_user }}"
  register: node_binary_path_headplane

- name: 'Set Node.js binary path fact'
  ansible.builtin.set_fact:
    headplane_node_path: "{{ node_binary_path_headplane.stdout }}"

- name: 'Display Node.js binary path'
  ansible.builtin.debug:
    msg: "Headplane Node.js binary: {{ headplane_node_path }}"

- name: 'Create headplane directories'
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: "{{ headplane_user }}"
    group: "{{ headplane_user }}"
    mode: '0755'
  loop:
    - '{{ headplane_data_dir }}'
    - '{{ headplane_log_dir }}'
    - '{{ headplane_config_dir }}'
