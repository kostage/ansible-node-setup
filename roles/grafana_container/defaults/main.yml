---
# Grafana Container Role - Default Variables
# This role deploys Grafana using Podman Quadlet (rootless containers)

# System user configuration
grafana_container_user: "grafana"
grafana_container_uid: 472
grafana_container_gid: 472
grafana_container_shell: "/usr/sbin/nologin"
grafana_container_home: "/var/lib/grafana"

# Grafana container configuration
grafana_container_image: "docker.io/grafana/grafana:latest"
grafana_container_name: "grafana"
grafana_container_port: 3000

# Data persistence
grafana_container_volume_name: "grafana-data"

# Grafana administration (should be overridden with KeePass lookups)
grafana_admin_user: "admin"
grafana_admin_password: "changeme"

# Domains for SSL certificates
grafana_domains: []

# Grafana configuration (grafana.ini format)
# These settings will be written to the mounted grafana.ini file
grafana_ini_config:
  server:
    http_port: 3000
    root_url: "%(protocol)s://%(domain)s/"
  security:
    admin_user: "{{ grafana_admin_user }}"
    admin_password: "{{ grafana_admin_password }}"
    cookie_secure: true
    cookie_samesite: "lax"
    disable_gravatar: true
    content_security_policy: true
    x_content_type_options: true
    x_xss_protection: true
    strict_transport_security: true
    strict_transport_security_max_age: "86400"
  users:
    viewers_can_edit: false
  auth:
    disable_login_form: false
  database:
    type: "sqlite3"
    path: "var/lib/grafana/grafana.db"

# Podman configuration
grafana_podman_version_minimum: "5.0.0"
grafana_container_quadlet_dir: ".config/containers/systemd"

# SSL and reverse proxy
grafana_nginx_ssl_protocols: "TLSv1.2 TLSv1.3"
grafana_nginx_ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
grafana_nginx_security_headers:
  X-Frame-Options: "DENY"
  X-Content-Type-Options: "nosniff"
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;"
