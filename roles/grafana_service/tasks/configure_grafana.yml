---
# Configure Grafana

- name: 'Ensure Grafana directories exist with proper permissions'
  become: true
  ansible.builtin.file:
    path: '{{ item }}'
    state: directory
    owner: '{{ grafana_user }}'
    group: '{{ grafana_group }}'
    mode: '0755'
  loop:
    - '{{ grafana_data_dir }}'
    - '{{ grafana_log_dir }}'
    - '{{ grafana_plugins_dir }}'
    - '{{ grafana_provisioning_dir }}'

- name: 'Deploy grafana.ini configuration'
  become: true
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: '{{ grafana_config_dir }}/grafana.ini'
    owner: '{{ grafana_user }}'
    group: '{{ grafana_group }}'
    mode: '0640'
  notify:
    - 'Restart Grafana service'
