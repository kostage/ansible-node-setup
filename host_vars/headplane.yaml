---
ssh_port: 22
ansible_become_password: "{{ lookup('keepass', 'headplane/root', 'password') }}"

# SSH key paths for different connection stages
ssh_root_key_path: '/Users/kostage/Doroshenko/nodes/vultrssh'

node:
  ip: "{{ lookup('keepass', 'headplane/ip', 'password') }}"

user:
  name: "{{ lookup('keepass', 'headplane/user', 'username') }}"
  password: "{{ lookup('keepass', 'headplane/user', 'password') }}"
  email: "{{ lookup('keepass', 'headplane/email', 'password') }}"
  ssh_key_path: "/Users/kostage/Doroshenko/nodes/headplane/ssh"
  ssh_key_file: "{{ lookup('keepass', 'headplane/user', 'username') }}_id_rsa" # & .pub

# Firewall configuration
firewall_rules:
  - rule: allow
    port: 443
  - rule: allow
    port: 80
  - rule: allow
    port: 22
  - rule: allow
    port: 3478 # STUN for Headscale Embedded Derp

# Package configuration
apt_packages:
  - curl
  - wget
  - git
  - unzip
  - python3
  - python3-pip
  - python3-debian
  - software-properties-common
  - build-essential

headscale_user: headscale
headscale_dns_domain: "{{ lookup('keepass', 'headplane/domain_name', 'username') }}"
headscale_server_url: "https://headscale.{{ lookup('keepass', 'headplane/domain_name', 'username') }}:443"
headscale_domains:
  - "headscale.{{ lookup('keepass', 'headplane/domain_name', 'username') }}"
  - "www.headscale.{{ lookup('keepass', 'headplane/domain_name', 'username') }}"
headscale_service_port: 4444

headplane_user: headplane
headplane_password: "{{ lookup('keepass', 'headplane/user', 'password') }}"
headplane_domain: "headplane.{{ lookup('keepass', 'headplane/domain_name', 'username') }}"
headplane_domains:
  - "headplane.{{ lookup('keepass', 'headplane/domain_name', 'username') }}"
  - "www.headplane.{{ lookup('keepass', 'headplane/domain_name', 'username') }}"
headplane_service_port: 7777

# Prometheus configuration
prometheus_username: 'prometheus'
prometheus:
  nodes: []

# Alertmanager configuration
alertmanager_version: latest
alertmanager_system_user: alertmanager
alertmanager_receivers:
  - name: 'telegram'
    telegram_configs:
      - api_url: 'https://api.telegram.org'
        bot_token: "{{ lookup('keepass', 'telegram_bot/token', 'password') }}"
        chat_id: "{{ telegram_chat_id }}"
        disable_notifications: false
        http_config:
          follow_redirects: true
        send_resolved: true
        parse_mode: HTML

alertmanager_route:
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  receiver: 'telegram'
