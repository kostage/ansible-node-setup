---
# Leaf Node Example Playbook
#
# This playbook demonstrates how to set up a leaf node with:
# - Basic user and package setup
# - Node Exporter with TLS enabled for secure scraping
#
# Key difference from headplane nodes:
# - Headplane: Node exporter runs without TLS (scraped by local Prometheus)
# - Leaf nodes: Node exporter runs WITH TLS (scraped remotely by headplane Prometheus)
#
# The headplane server has the self-signed root CA certificate installed,
# allowing it to verify and scrape leaf node exporters over TLS.

- name: Create user with password and ssh key
  hosts: node_exporters
  remote_user: root
  become: false
  vars:
    ansible_ssh_private_key_file: "{{ ssh_root_key_path }}"
  tasks:
    - name: 'Install rsync on remote'
      ansible.builtin.import_role:
        name: apt
      vars:
        apt_packages:
          - rsync
      become: false
    - name: 'Create user'
      ansible.builtin.import_role:
        name: user

- name: 'Install packages'
  hosts: node_exporters
  become: true
  remote_user: "{{ user.name }}"
  vars:
    ansible_ssh_private_key_file: "{{ user.ssh_key_path }}/{{ user.ssh_key_file }}"
  tasks:
    - name: 'Import role'
      ansible.builtin.import_role:
        name: apt

- name: 'Generate and install TLS certificate for node exporter'
  hosts: node_exporters
  become: true
  remote_user: "{{ user.name }}"
  vars:
    ansible_ssh_private_key_file: "{{ user.ssh_key_path }}/{{ user.ssh_key_file }}"
  tasks:
    - name: 'Import leaf_cert_gen role'
      ansible.builtin.import_role:
        name: leaf_cert_gen
      # This generates a TLS certificate signed by the headplane CA
      # The certificate is deployed to the node and used by node_exporter

- name: 'Install Node Exporter with TLS'
  hosts: node_exporters
  become: true
  remote_user: "{{ user.name }}"
  vars:
    ansible_ssh_private_key_file: "{{ user.ssh_key_path }}/{{ user.ssh_key_file }}"
  tasks:
    - name: 'Import node_exporter role'
      ansible.builtin.import_role:
        name: prometheus.prometheus.node_exporter
      # Note: Node exporter should be configured to use TLS with the
      # certificate generated by leaf_cert_gen role (check role defaults for
      # TLS configuration parameters)

- name: 'Tune SSH'
  hosts: node_exporters
  become: true
  remote_user: "{{ user.name }}"
  vars:
    ansible_ssh_private_key_file: "{{ user.ssh_key_path }}/{{ user.ssh_key_file }}"
  tasks:
    - name: 'Import role'
      ansible.builtin.import_role:
        name: ssh

- name: 'Configure firewall'
  hosts: node_exporters
  become: true
  remote_user: "{{ user.name }}"
  vars:
    ansible_ssh_private_key_file: "{{ user.ssh_key_path }}/{{ user.ssh_key_file }}"
  tasks:
    - name: 'Import role'
      ansible.builtin.import_role:
        name: firewall
      vars:
        firewall_rules:
          - rule: allow
            port: "{{ node_exporter_tls_port }}"  # Allow TLS-protected node exporter
